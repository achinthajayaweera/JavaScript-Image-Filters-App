<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Filters</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <div class="filters">
            <ul>
                <li>
                    <label for="saturate">Saturate</label>
                    <input class="filter" type="range" id="saturate" min="0" max="200" value="100" />
                </li>
                <li>
                    <label for="contrast">Contrast</label>
                    <input class="filter" type="range" id="contrast" min="0" max="200" value="100" />
                </li>
                <li>
                    <label for="brightness">Brightness</label>
                    <input class="filter" type="range" id="brightness" min="0" max="200" value="100" />
                </li>
                <li>
                    <label for="sepia">Sepia</label>
                    <input class="filter" type="range" id="sepia" min="0" max="200" value="0" />
                </li>
                <li>
                    <label for="grayscale">Grayscale</label>
                    <input class="filter" type="range" id="grayscale" min="0" max="100" value="0" />
                </li>
                <li>
                    <label for="blur">Blur</label>
                    <input class="filter" type="range" id="blur" min="0" max="10" step="0.1" value="0" />
                </li>
                <li>
                    <label for="hue-rotate">Hue Rotate</label>
                    <input class="filter" type="range" id="hue-rotate" min="0" max="350" value="0" />
                </li>
                <li>
                    <a download="image" id="download">Download</a>
                    <span id="reset">Reset</span>
                </li>
            </ul>
        </div>
        <div class="img">
            <div class="img-box">
                <img id="img" alt="uploaded image" />
                <canvas id="canvas"></canvas>
            </div>
            <div class="upload">
                <label for="upload">Upload</label>
                <input type="file" id="upload" />
            </div>
        </div>
    </div>
</body>

</html>
